<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="r-bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="60%" stop-color="#0e0e11" />
      <stop offset="100%" stop-color="#060607" />
    </radialGradient>

    <!-- Warm Amber Gold Gradients -->
    <linearGradient id="r-gold-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0d4" />
      <stop offset="35%" stop-color="#f5cf92" />
      <stop offset="70%" stop-color="#e3b57a" />
      <stop offset="100%" stop-color="#b67f3c" />
    </linearGradient>

    <linearGradient id="r-gold-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3b57a" />
      <stop offset="50%" stop-color="#a67435" />
      <stop offset="100%" stop-color="#6e491c" />
    </linearGradient>

    <linearGradient id="r-titanium-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4b54" />
      <stop offset="50%" stop-color="#2d2e35" />
      <stop offset="100%" stop-color="#1c1d22" />
    </linearGradient>

    <linearGradient id="r-titanium-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2b32" />
      <stop offset="100%" stop-color="#121316" />
    </linearGradient>

    <linearGradient id="r-rim-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(245, 207, 146, 0.4)" />
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="r-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="r-specular" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect width="512" height="512" rx="124" fill="url(#r-bg)" />
  <rect width="510" height="510" x="1" y="1" rx="123" stroke="url(#r-rim-light)" stroke-width="2" />

  <!-- Ambient Light Bloom -->
  <circle cx="280" cy="240" r="140" fill="#e3b57a" opacity="0.12" filter="url(#r-glow)" />

  <!-- Architectural Faceted 'R' -->
  <g id="renderly-mark">
    <!-- Left Pillar Facets -->
    <!-- Pillar Outer Dark Bevel -->
    <polygon points="140,116 174,150 174,362 140,396" fill="url(#r-titanium-dark)" />
    <!-- Pillar Main Front Facet -->
    <polygon points="174,150 208,116 208,396 174,362" fill="url(#r-titanium-light)" />
    <!-- Pillar Gold Edge Accent -->
    <polygon points="174,150 182,158 182,354 174,362" fill="url(#r-gold-bright)" opacity="0.85" />

    <!-- Top Loop / Aperture Facets -->
    <!-- Top Horizontal Beam Outer -->
    <polygon points="208,116 324,116 302,154 208,154" fill="url(#r-titanium-light)" />
    <!-- Top Arch Upper Curve (Gold) -->
    <path d="M 324,116 C 374,116 400,154 400,210 C 400,248 382,278 350,294 L 322,254 C 342,244 354,230 354,210 C 354,178 338,154 302,154 L 324,116 Z" fill="url(#r-gold-bright)" />
    <!-- Arch Lower Return Bevel -->
    <polygon points="208,244 302,244 322,254 290,284 208,284" fill="url(#r-gold-deep)" />
    <!-- Loop Center Core Cutout Ambient Depth -->
    <polygon points="208,154 302,154 302,244 208,244" fill="#0d0e11" />
    <polygon points="208,154 224,170 224,228 208,244" fill="#1b1c20" />

    <!-- Dynamic Diagonal Rendering Kick / Ray Leg -->
    <!-- Upper Facet of Kick (Brilliant Champagne Gold) -->
    <polygon points="274,260 326,242 400,380 348,396" fill="url(#r-gold-bright)" filter="url(#r-glow)" opacity="0.95" />
    <!-- Lower Shadow Facet of Kick -->
    <polygon points="274,260 348,396 312,396 248,276" fill="url(#r-gold-deep)" />
    <!-- Sharp Refraction Chamfer -->
    <polygon points="326,242 400,380 384,396 322,266" fill="#fff5e3" opacity="0.75" />

    <!-- Horizontal Mid Rib Junction -->
    <polygon points="208,244 274,260 248,276 208,276" fill="url(#r-titanium-dark)" />

    <!-- Specular Star Flare at focal nexus (Renderly Ray Nexus) -->
    <g transform="translate(325, 246)" filter="url(#r-specular)">
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
      <polygon points="0,-18 3,-4 18,0 3,4 0,18 -3,4 -18,0 -3,-4" fill="#ffffff" opacity="0.9" />
      <polygon points="0,-10 2,-2 10,0 2,2 0,10 -2,2 -10,0 -2,-2" fill="url(#r-gold-bright)" />
    </g>

    <!-- Subtle Secondary Flare at apex -->
    <g transform="translate(372, 172)" opacity="0.6">
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
      <polygon points="0,-10 1.5,-2 10,0 1.5,2 0,10 -1.5,2 -10,0 -1.5,-2" fill="#fff2db" />
    </g>
  </g>
</svg>